<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sequence Spinner</title>

<style>
*{
    box-sizing:border-box
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden
}

body{
    font-family:Arial;
    background:#080a18;
    color:white
}

.screen{
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px
}

.title{
    font-size:clamp(22px,4vw,44px);
    font-weight:900
}

.wheel{
    width:min(78vh,82vw,760px);
    aspect-ratio:1;
    position:relative;
    margin:5px auto 8px
}

canvas{
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:0 0 45px #000
}

.pointer{
    position:absolute;
    z-index:5;
    left:50%;
    top:-2px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:52px solid white;
    filter:drop-shadow(0 4px 4px #000)
}

.center{
    position:absolute;
    z-index:4;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72px;
    height:72px;
    border-radius:50%;
    background:#11152b;
    border:6px solid white
}

button{
    border:0;
    border-radius:15px;
    color:white;
    font-weight:900;
    cursor:pointer
}

.spin{
    width:min(430px,88vw);
    padding:15px;
    font-size:clamp(20px,3vw,32px);
    background:#ff4f81
}

.spin:disabled{
    opacity:.45;
    cursor:not-allowed
}

.result{
    font-size:clamp(22px,4vw,48px);
    font-weight:900;
    color:#ffe66d;
    min-height:52px;
    text-align:center
}


/* =========================================================
   RESULT CELEBRATION
   ========================================================= */

#celebration{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(
            circle at center,
            #17245fff 0%,
            #080a18f5 70%
        );
    overflow:hidden;
}


/* Big result name */

#bigResult{
    position:relative;
    z-index:110;

    width:96vw;

    text-align:center;

    font-size:
        clamp(
            45px,
            12vw,
            150px
        );

    font-weight:1000;

    line-height:1.05;

    color:#fff;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ffe66d,
        0 0 50px #ff4f81,
        4px 5px 0 #000;

    padding:20px;

    animation:
        resultPop .65s cubic-bezier(.17,.67,.35,1.4);
}


@keyframes resultPop{

    0%{
        transform:scale(.15);
        opacity:0
    }

    65%{
        transform:scale(1.12);
        opacity:1
    }

    100%{
        transform:scale(1);
        opacity:1
    }

}


/* Small text */

#winnerText{
    position:relative;
    z-index:110;

    font-size:
        clamp(
            18px,
            4vw,
            32px
        );

    font-weight:900;

    color:#ffe66d;

    margin-top:5px;

    letter-spacing:2px;
}


/* Confetti canvas */

#confettiCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:105;
    pointer-events:none
}


/* Fake poppers */

.popper{
    position:absolute;

    width:25px;
    height:25px;

    border-radius:50%;

    z-index:106;

    pointer-events:none;
}


/* Left popper */

.popper.left{
    left:3%;
    top:50%;

    animation:
        popLeft .7s ease-out forwards
}


/* Right popper */

.popper.right{
    right:3%;
    top:50%;

    animation:
        popRight .7s ease-out forwards
}


@keyframes popLeft{

    0%{
        transform:scale(.2) rotate(0);
        opacity:1
    }

    100%{
        transform:
            translate(
                45vw,
                -45vh
            )
            scale(3)
            rotate(360deg);

        opacity:0
    }

}


@keyframes popRight{

    0%{
        transform:scale(.2) rotate(0);
        opacity:1
    }

    100%{
        transform:
            translate(
                -45vw,
                -45vh
            )
            scale(3)
            rotate(-360deg);

        opacity:0
    }

}


/* Celebration decision buttons */

#celebrationDecision{
    position:absolute;

    z-index:120;

    bottom:7vh;

    display:none;

    gap:15px;

    width:min(500px,88vw)
}

#celebrationDecision button{
    flex:1;

    padding:16px;

    font-size:
        clamp(
            15px,
            3vw,
            22px
        );

    border-radius:16px
}


#celebrationRemove{
    background:#e63946
}


#celebrationKeep{
    background:#46d7a5
}


/* =========================================================
   NORMAL RESULT DECISION BUTTONS
   ========================================================= */

#decision{
    display:none;
    gap:10px;
    width:min(430px,88vw);
    margin-top:5px
}

#removeSlice,
#keepSlice{
    flex:1;
    padding:13px;
    font-size:15px
}

#removeSlice{
    background:#e63946
}

#keepSlice{
    background:#46d7a5
}


/* =========================================================
   SETTINGS
   ========================================================= */

#settings{
    position:fixed;
    right:10px;
    top:10px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#ffffff18;
    opacity:.25
}

#panel{
    position:fixed;
    inset:0;
    background:#090b18ee;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:200
}

.box{
    width:min(520px,94vw);
    background:#1a1d35;
    border-radius:20px;
    padding:20px
}

.box h2{
    margin-top:0
}

textarea{
    width:100%;
    min-height:100px;
    border:0;
    border-radius:12px;
    padding:12px;
    font-size:16px
}

.row{
    display:flex;
    gap:8px;
    margin-top:10px
}

.row>*{
    flex:1;
    padding:12px;
    background:#6651e8
}

.gray{
    background:#454962!important
}

.info{
    font-size:13px;
    color:#c8c9da
}

</style>
</head>


<body>


<main class="screen">

    <div class="title">
        🎡 SPIN THE WHEEL
    </div>


    <div class="wheel">

        <div class="pointer"></div>

        <canvas
            id="wheel"
            width="1000"
            height="1000">
        </canvas>

        <div class="center"></div>

    </div>


    <button id="spin" class="spin">
        SPIN
    </button>


    <div id="result" class="result"></div>


    <!-- Normal decision buttons -->

    <div id="decision">

        <button id="removeSlice">
            REMOVE SLICE
        </button>

        <button id="keepSlice">
            KEEP SLICE
        </button>

    </div>

</main>



<button id="settings">
    ⚙
</button>



<!-- =====================================================
     FULL SCREEN RESULT CELEBRATION
     ===================================================== -->

<div id="celebration">

    <canvas id="confettiCanvas"></canvas>


    <div class="popper left"></div>
    <div class="popper right"></div>


    <div id="winnerText">
        🎉 SELECTED 🎉
    </div>


    <div id="bigResult">
        NAME
    </div>


    <div id="celebrationDecision">

        <button id="celebrationRemove">
            REMOVE SLICE
        </button>

        <button id="celebrationKeep">
            KEEP SLICE
        </button>

    </div>

</div>



<!-- =====================================================
     SETTINGS PANEL
     ===================================================== -->

<div id="panel">

    <div class="box">

        <h2>
            Wheel Setup
        </h2>

        <p class="info">
            Set the sequence before the event.
            It is not shown on the main screen.
        </p>


        <textarea id="sequence">Adwaitha, Devika, Surya, Anugraha, Gokul, Pravya, Arya, Aneesh</textarea>


        <div class="row">

            <button id="apply">
                Set Sequence
            </button>

            <button id="close" class="gray">
                Close
            </button>

        </div>


        <div class="row">

            <button id="shuffle">
                🔀 Shuffle
            </button>

            <button id="undo" class="gray">
                ↩ Undo Shuffle
            </button>

        </div>


        <p id="message" class="info"></p>

    </div>

</div>



<script>


/* =========================================================
   PRESET SEQUENCE
   ========================================================= */

const PRESET_SEQUENCE=[
    "Adwaitha",
    "Devika",
    "Surya",
    "Anugraha",
    "Gokul",
    "Pravya",
    "Arya",
    "Aneesh"
];



const c=
    document.getElementById("wheel");

const ctx=
    c.getContext("2d");


const spin=
    document.getElementById("spin");

const res=
    document.getElementById("result");


const decision=
    document.getElementById("decision");

const removeSlice=
    document.getElementById("removeSlice");

const keepSlice=
    document.getElementById("keepSlice");



/* =========================================================
   CELEBRATION ELEMENTS
   ========================================================= */

const celebration=
    document.getElementById("celebration");

const bigResult=
    document.getElementById("bigResult");

const celebrationDecision=
    document.getElementById("celebrationDecision");

const celebrationRemove=
    document.getElementById("celebrationRemove");

const celebrationKeep=
    document.getElementById("celebrationKeep");

const confettiCanvas=
    document.getElementById("confettiCanvas");

const confettiCtx=
    confettiCanvas.getContext("2d");



/* =========================================================
   ORIGINAL SEQUENCE
   ========================================================= */

let original=[
    ...PRESET_SEQUENCE
];



/* =========================================================
   CURRENT VISIBLE WHEEL
   ========================================================= */

let active=[
    ...PRESET_SEQUENCE
];



/* Next predetermined result */

let pos=0;


/* Current wheel rotation */

let rot=0;


/* Animation lock */

let busy=false;


/* Selected slice */

let selectedIndex=-1;


/* Waiting for remove/keep */

let waitingForDecision=false;


/* Confetti animation */

let confettiAnimation=null;


/* =========================================================
   COLORS
   ========================================================= */

const colors=[
    "#ff5c7a",
    "#5b8cff",
    "#ffc857",
    "#46d7a5",
    "#b56cff",
    "#ff8a4c",
    "#45c6e8",
    "#ef6fff",
    "#8bd450",
    "#ffcf5a"
];



/* =========================================================
   DRAW WHEEL
   ========================================================= */

function draw(){

    let n=active.length;


    ctx.clearRect(
        0,
        0,
        1000,
        1000
    );


    if(!n){

        ctx.beginPath();

        ctx.arc(
            500,
            500,
            455,
            0,
            2*Math.PI
        );

        ctx.fillStyle="#11152b";

        ctx.fill();

        return;
    }


    let s=
        2*Math.PI/n;

    let r=455;


    ctx.save();

    ctx.translate(
        500,
        500
    );

    ctx.rotate(rot);


    for(let i=0;i<n;i++){

        let a=
            -Math.PI/2+
            i*s;

        let b=
            a+s;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.arc(
            0,
            0,
            r,
            a,
            b
        );

        ctx.closePath();


        ctx.fillStyle=
            colors[
                i%colors.length
            ];

        ctx.fill();


        ctx.strokeStyle="#fff";

        ctx.lineWidth=6;

        ctx.stroke();


        ctx.save();

        ctx.rotate(
            a+s/2
        );

        ctx.textAlign="right";

        ctx.fillStyle="#fff";

        ctx.font=
            "900 "+
            Math.max(
                24,
                Math.min(
                    56,
                    600/n
                )
            )+
            "px Arial";


        ctx.shadowColor="#000";

        ctx.shadowBlur=5;


        ctx.fillText(
            String(
                active[i]
            ).slice(0,18),

            r-38,

            18
        );


        ctx.restore();

    }


    ctx.restore();
}



/* =========================================================
   CONFETTI
   ========================================================= */

let confetti=[];


function createConfetti(){

    confetti=[];


    let count=260;


    for(let i=0;i<count;i++){

        confetti.push({

            x:
                Math.random()*
                window.innerWidth,

            y:
                -Math.random()*
                window.innerHeight,

            width:
                5+
                Math.random()*9,

            height:
                7+
                Math.random()*14,

            speed:
                3+
                Math.random()*6,

            rotation:
                Math.random()*
                Math.PI*2,

            rotationSpeed:
                -.15+
                Math.random()*.3,

            gravity:
                .04+
                Math.random()*.08,

            drift:
                -.7+
                Math.random()*1.4,

            opacity:1,

            color:
                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ]

        });

    }

}



/* =========================================================
   CONFETTI ANIMATION
   ========================================================= */

function animateConfetti(){

    confettiCtx.clearRect(
        0,
        0,
        confettiCanvas.width,
        confettiCanvas.height
    );


    for(let piece of confetti){

        piece.y+=piece.speed;

        piece.speed+=piece.gravity;

        piece.x+=piece.drift;

        piece.rotation+=
            piece.rotationSpeed;


        confettiCtx.save();


        confettiCtx.translate(
            piece.x,
            piece.y
        );


        confettiCtx.rotate(
            piece.rotation
        );


        confettiCtx.globalAlpha=
            piece.opacity;


        confettiCtx.fillStyle=
            piece.color;


        confettiCtx.fillRect(
            -piece.width/2,
            -piece.height/2,
            piece.width,
            piece.height
        );


        confettiCtx.restore();


        if(
            piece.y>
            window.innerHeight+50
        ){

            piece.y=
                -Math.random()*300;

            piece.x=
                Math.random()*
                window.innerWidth;

            piece.speed=
                3+
                Math.random()*5;

        }

    }


    confettiAnimation=
        requestAnimationFrame(
            animateConfetti
        );

}



/* =========================================================
   RESIZE CONFETTI CANVAS
   ========================================================= */

function resizeConfetti(){

    confettiCanvas.width=
        window.innerWidth;

    confettiCanvas.height=
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resizeConfetti
);


resizeConfetti();



/* =========================================================
   SHOW FULL SCREEN RESULT
   ========================================================= */

function showCelebration(name){

    bigResult.textContent=name;


    celebration.style.display=
        "flex";


    celebrationDecision.style.display=
        "none";


    createConfetti();


    if(confettiAnimation){

        cancelAnimationFrame(
            confettiAnimation
        );

    }


    animateConfetti();


    /*
       Popper elements are recreated
       so their animation runs every time.
    */

    document.querySelectorAll(
        ".popper"
    ).forEach(
        p=>{

            p.style.animation="none";

            void p.offsetWidth;

            if(
                p.classList.contains("left")
            ){

                p.style.animation=
                    "popLeft .7s ease-out forwards";

            }else{

                p.style.animation=
                    "popRight .7s ease-out forwards";

            }

        }
    );


    /*
       Show decision buttons after
       the result has appeared.
    */

    setTimeout(
        ()=>{

            celebrationDecision.style.display=
                "flex";

        },
        1200
    );

}



/* =========================================================
   CLOSE CELEBRATION
   ========================================================= */

function closeCelebration(){

    celebration.style.display=
        "none";


    celebrationDecision.style.display=
        "none";


    if(confettiAnimation){

        cancelAnimationFrame(
            confettiAnimation
        );

        confettiAnimation=null;

    }

}



/* =========================================================
   SPIN WHEEL
   ========================================================= */

function spinWheel(){

    if(busy)return;

    if(waitingForDecision)return;

    if(active.length===0)return;

    if(pos>=original.length)return;


    busy=true;

    spin.disabled=true;


    let n=
        active.length;


    /*
       Next result comes from ORIGINAL
       predetermined sequence.
    */

    let wantedResult=
        original[pos];


    /*
       Find the corresponding visible
       slice.
    */

    let i=
        active.indexOf(
            wantedResult
        );


    if(i===-1){

        busy=false;

        spin.disabled=false;

        return;

    }


    let s=
        2*Math.PI/n;


    /*
       Pointer is at TOP.

       Center of selected slice goes
       exactly under the pointer.
    */

    let targetCenter=
        -Math.PI/2+
        (i+0.5)*s;


    let desired=
        -Math.PI/2-
        targetCenter;


    let current=
        (
            (rot%(2*Math.PI))+
            2*Math.PI
        )%
        (2*Math.PI);


    let delta=
        (
            (desired-current)%
            (2*Math.PI)+
            2*Math.PI
        )%
        (2*Math.PI);


    /*
       Extra rotations.
    */

    delta+=
        (
            5+
            Math.floor(
                Math.random()*3
            )
        )*
        2*Math.PI;


    let start=rot;

    let end=
        rot+delta;

    let t0=
        performance.now();



    function go(t){

        let p=
            Math.min(
                1,
                (t-t0)/4200
            );


        let e=
            1-Math.pow(
                1-p,
                4
            );


        rot=
            start+
            (end-start)*e;


        draw();


        if(p<1){

            requestAnimationFrame(
                go
            );

        }else{

            rot=end;

            draw();


            /*
               Show normal result.
            */

            res.textContent=
                wantedResult;


            selectedIndex=i;


            /*
               Move to next predetermined
               result.
            */

            pos++;


            waitingForDecision=true;


            busy=false;


            /*
               Hide normal buttons because
               full-screen result is coming.
            */

            decision.style.display=
                "none";


            spin.disabled=true;


            /*
               FULL SCREEN CELEBRATION
            */

            showCelebration(
                wantedResult
            );

        }

    }


    requestAnimationFrame(
        go
    );

}



/* =========================================================
   REMOVE FROM FULL SCREEN
   ========================================================= */

celebrationRemove.onclick=()=>{

    if(!waitingForDecision)return;

    if(selectedIndex<0)return;


    /*
       Remove the exact slice that
       produced the current result.
    */

    active.splice(
        selectedIndex,
        1
    );


    selectedIndex=-1;

    waitingForDecision=false;


    /*
       Close full-screen celebration.
    */

    closeCelebration();


    /*
       Clear normal result.
    */

    res.textContent="";


    /*
       Reset wheel rotation.
    */

    rot=0;

    draw();


    /*
       Allow next spin if results remain.
    */

    if(
        active.length>0 &&
        pos<original.length
    ){

        spin.disabled=false;

    }else{

        spin.disabled=true;

    }

};



/* =========================================================
   KEEP SLICE FROM FULL SCREEN
   ========================================================= */

celebrationKeep.onclick=()=>{

    if(!waitingForDecision)return;


    /*
       Keep the selected slice.

       Nothing is removed from the wheel.
    */

    selectedIndex=-1;

    waitingForDecision=false;


    /*
       Close full-screen celebration.
    */

    closeCelebration();


    /*
       Clear normal result.
    */

    res.textContent="";


    /*
       Reset wheel rotation.
    */

    rot=0;

    draw();


    /*
       Allow the next spin.
    */

    if(
        active.length>0 &&
        pos<original.length
    ){

        spin.disabled=false;

    }else{

        spin.disabled=true;

    }

};



/* =========================================================
   PARSE SEQUENCE
   ========================================================= */

function parse(){

    return document
        .getElementById("sequence")
        .value
        .split(/[,;\n]+|\s{2,}/)
        .map(x=>x.trim())
        .filter(Boolean);

}



/* =========================================================
   SET SEQUENCE
   ========================================================= */

document.getElementById("apply").onclick=()=>{

    let a=parse();

    if(a.length<2)return;


    /*
       Replace original sequence.
    */

    original=[...a];


    /*
       Create a fresh visible wheel.
    */

    active=[...a];


    pos=0;

    rot=0;

    selectedIndex=-1;

    waitingForDecision=false;

    busy=false;


    res.textContent="";

    decision.style.display="none";

    celebration.style.display="none";

    celebrationDecision.style.display="none";

    spin.disabled=false;


    draw();

};



/* =========================================================
   SHUFFLE
   ========================================================= */

document.getElementById("shuffle").onclick=()=>{

    if(busy)return;

    if(waitingForDecision)return;


    /*
       Shuffle ONLY the visible wheel.

       The original predetermined sequence
       remains unchanged.
    */

    active=[...active];


    for(
        let i=active.length-1;
        i>0;
        i--
    ){

        let j=
            Math.floor(
                Math.random()*(i+1)
            );


        [
            active[i],
            active[j]
        ]=[
            active[j],
            active[i]
        ];

    }


    rot=0;

    res.textContent="";

    draw();

};



/* =========================================================
   UNDO SHUFFLE
   ========================================================= */

document.getElementById("undo").onclick=()=>{

    if(busy)return;

    if(waitingForDecision)return;


    /*
       Restore the remaining items from
       the original sequence.

       Already completed results stay completed.
    */

    let remainingOriginal=
        original.slice(pos);


    active=[
        ...remainingOriginal
    ];


    rot=0;

    res.textContent="";

    draw();

};



/* =========================================================
   SETTINGS BUTTON
   ========================================================= */

document.getElementById("settings").onclick=()=>{

    if(busy)return;

    if(waitingForDecision)return;


    document.getElementById("sequence").value=
        original.join(", ");


    document.getElementById("panel").style.display=
        "flex";

};



/* =========================================================
   CLOSE SETTINGS
   ========================================================= */

document.getElementById("close").onclick=()=>{

    document.getElementById("panel").style.display=
        "none";

};



/* =========================================================
   SPIN BUTTON
   ========================================================= */

spin.onclick=spinWheel;



/* =========================================================
   INITIAL DRAW
   ========================================================= */

draw();

</script>

</body>
</html>
